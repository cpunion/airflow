name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-macos:
    name: macOS Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build AirFlow (Release)
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test

  test-linux:
    name: Linux Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build AirFlow (Release)
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test

  test-windows:
    name: Windows Build & Test
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Visual Studio Development Environment
        uses: compnerd/gha-setup-vsdevenv@main
        with:
          winsdk: "10.0.22621.0"

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.0.3"

      - name: Configure Windows SDK Module Maps
        shell: pwsh
        run: |
          $source = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          $target = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0"
          if (Test-Path $source) {
            Get-ChildItem -Path $source -Recurse -Filter "*modulemap" | ForEach-Object {
              $rel = $_.FullName.Substring($source.Length)
              $dest = Join-Path $target $rel
              $destDir = Split-Path $dest
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
              Copy-Item $_.FullName $dest -Force
              Write-Host "Copied $($_.FullName) -> $dest"
            }
          }

      - name: Build AirFlow (Release)
        run: swift build -c release

      - name: Run Unit Tests
        run: swift test
