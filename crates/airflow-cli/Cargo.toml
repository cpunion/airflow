[package]
name = "airflow-cli"
version = "0.1.0"
edition = "2021"
description = "Universal cross-platform wireless headphone handoff CLI client"
license = "MIT"
authors = ["Li Jie <cpunion>"]

[[bin]]
name = "airflow"
path = "src/main.rs"

[dependencies]
airflow-core = { path = "../airflow-core" }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.38", features = ["full"] }
