[package]
name = "airflow-core"
version = "0.1.0"
edition = "2021"
description = "Universal cross-platform wireless headphone handoff arbitration core"
license = "MIT"
authors = ["Li Jie <cpunion>"]

[lib]
name = "airflow_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
